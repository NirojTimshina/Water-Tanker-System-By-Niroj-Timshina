<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Water Tanker System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5276 0%, #2874a6 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px 35px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            width: 340px;
            text-align: center;
        }
        .login-box h1 { font-size: 22px; color: #1a5276; margin-bottom: 5px; }
        .login-box p { color: #7a8a99; font-size: 13px; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1.5px solid #dde5eb;
            border-radius: 8px;
            font-size: 14px;
        }
        .login-box input:focus { outline: none; border-color: #2874a6; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2874a6 0%, #1a5276 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }
        .login-box button:hover { box-shadow: 0 4px 12px rgba(40,116,166,0.4); }
        .error-msg {
            color: #c0392b;
            background-color: #fde2e0;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>💧 Water Tanker System</h1>
        <p>Admin Login</p>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>

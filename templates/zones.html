{% extends "base.html" %}
{% block content %}
    <h1>Zones</h1>

    <h2>Add New Zone</h2>
    <form method="POST" action="/zones-page/add">
        <input type="text" name="zone_name" placeholder="Zone Name" required>
        <input type="number" name="ward_number" placeholder="Ward Number">
        <input type="number" name="population_estimate" placeholder="Population Estimate">
        <button type="submit">Add Zone</button>
    </form>

    <h2>All Zones</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Zone Name</th>
            <th>Ward Number</th>
            <th>Population</th>
            <th>Action</th>
        </tr>
        {% for zone in zones %}
        <tr>
            <td>{{ zone.zone_id }}</td>
            <td>{{ zone.zone_name }}</td>
            <td>{{ zone.ward_number }}</td>
            <td>{{ zone.population_estimate }}</td>
            <td>
                <form method="POST" action="/zones-page/delete/{{ zone.zone_id }}" style="display:inline;">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
